        function testDecrypt() {
            const resultEl = document.getElementById('result');
            resultEl.textContent = "开始解密...\n\n";

            try {
                // 分配内存
                var t = allocateUTF8(testData);
                resultEl.textContent += "输入地址: " + t + "\n\n";

                // 尝试解密 - 捕获 C++ 异常
                var n;
                try {
                    n = Module._cdt_descrypt(t);
                } catch (e) {
                    // Emscripten 会把 C++ 异常作为数字抛出
                    if (typeof e === 'number') {
                        resultEl.textContent += "捕获到 C++ 异常，地址: " + e + "\n\n";

                        // 尝试读取异常消息
                        // C++ 异常对象通常包含类型信息和消息
                        // 在 Emscripten 中，异常对象结构在特定偏移处

                        // 尝试读取可能的异常消息字符串
                        var exceptionPtr = e;
                        var heapBytes = Module.HEAPU8;

                        resultEl.textContent += "尝试读取异常对象内存...\n";

                        // 读取异常指针附近的数据
                        var hexDump = "";
                        for (var i = 0; i < 200; i++) {
                            if (i % 16 === 0) hexDump += "\n  " + (exceptionPtr + i).toString(16).padStart(8, '0') + ": ";
                            var b = heapBytes[exceptionPtr + i];
                            hexDump += b.toString(16).padStart(2, '0') + " ";
                        }
                        resultEl.textContent += hexDump + "\n\n";

                        // 尝试读取为字符串
                        try {
                            var exceptionMsg = UTF8ToString(exceptionPtr);
                            resultEl.textContent += "异常消息: " + exceptionMsg + "\n\n";
                        } catch (e2) {
                            resultEl.textContent += "无法读取异常消息: " + e2 + "\n\n";
                        }
                    } else {
                        resultEl.textContent += "JavaScript 异常: " + e + "\n";
                        resultEl.textContent += "名称: " + e.name + "\n";
                        resultEl.textContent += "消息: " + e.message + "\n\n";
                    }

                    Module._cdt_free(t);
                    return;
                }

                resultEl.textContent += "解密成功！结果地址: " + n + "\n\n";

                // 读取结果
                var o = UTF8ToString(n);
                resultEl.textContent += "解密结果长度: " + o.length + "\n\n";

                if (o.length > 0) {
                    resultEl.textContent += "=== 解密结果 ===\n" + o + "\n\n";

                    try {
                        var parsed = JSON.parse(o);
                        resultEl.textContent += "JSON解析成功！\n\n";
                        resultEl.textContent += JSON.stringify(parsed, null, 2);
                    } catch (jsonError) {
                        resultEl.textContent += "JSON解析失败: " + jsonError.message + "\n";
                    }
                } else {
                    resultEl.textContent += "警告: 结果为空\n";
                }

                // 释放内存
                Module._cdt_free(t);
                Module._cdt_free(n);

            } catch (e) {
                resultEl.textContent += "\n错误: " + e + "\n";
            }
        }
